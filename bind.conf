bind=SUPER+CTRL+SHIFT,c,reload_config

# menu and terminal (dwm-titus-aligned; Quickshell not DMS)
bind=SUPER,r,spawn,/bin/sh -c 'quickshell ipc --path "$HOME/.config/mango-titus/quickshell/shell.qml" call launcher toggle'
bind=SUPER,x,spawn,/bin/sh -c '$HOME/.config/mango-titus/scripts/terminal.sh'
bind=SUPER,e,spawn,thunar
# Same as dwm-titus: Looking Glass on Super+w (package optional / user-installed)
bind=SUPER,w,spawn,looking-glass-client -F
# Firefox kept in default install
bind=SUPER,b,spawn,firefox
bind=SUPER+SHIFT,w,spawn,/bin/sh -c '$HOME/.config/mango-titus/scripts/wallpaper.sh'

# Web apps (shared webapp-launch — same as dwm-titus)
bind=SUPER,a,spawn,webapp-launch https://chatgpt.com
bind=SUPER+SHIFT,a,spawn,webapp-launch https://gemini.google.com/
bind=SUPER+SHIFT,x,spawn,webapp-launch https://x.com/compose/post

# Application launcher
bind=Super,Space,spawn,/bin/sh -c 'quickshell ipc --path "$HOME/.config/mango-titus/quickshell/shell.qml" call launcher toggle'

# Control center / keybinds (when Quickshell config is present)
bind=SUPER,F1,spawn,/bin/sh -c 'quickshell ipc --path "$HOME/.config/mango-titus/quickshell/shell.qml" call controlcenter open'
bind=SUPER+ALT,F1,spawn,/bin/sh -c 'quickshell ipc --path "$HOME/.config/mango-titus/quickshell/shell.qml" call controlcenter open'
bind=SUPER,slash,spawn,/bin/sh -c 'quickshell ipc --path "$HOME/.config/mango-titus/quickshell/shell.qml" call controlcenter openKeybinds'
bind=SUPER+SHIFT,r,spawn,/bin/sh -c 'mango-titus-cc action restart-quickshell'

# Screenshots (Flameshot + portals on Wayland)
bind=SUPER,p,spawn,/bin/sh -c '$HOME/.config/mango-titus/scripts/screenshot.sh full'
bind=SUPER+SHIFT,p,spawn,/bin/sh -c '$HOME/.config/mango-titus/scripts/screenshot.sh gui'
bind=SUPER+CTRL,p,spawn,/bin/sh -c '$HOME/.config/mango-titus/scripts/screenshot.sh clip'

# Clipboard history (cliphist; Quickshell may wrap later)
bind=Super,V,spawn,/bin/sh -c '$HOME/.config/mango-titus/scripts/clipboard-history.sh'

# Theme / appearance
bind=SUPER+SHIFT,t,spawn,nwg-look

# Lock (swaylock-effects via helper)
bind=Super+Alt,L,spawn,/bin/sh -c '$HOME/.config/mango-titus/scripts/lock.sh'

# Volume / brightness / media (mangowm requires NONE for no-modifier binds)
bind=NONE,XF86AudioRaiseVolume,spawn,pactl set-sink-volume @DEFAULT_SINK@ +5%
bind=NONE,XF86AudioLowerVolume,spawn,pactl set-sink-volume @DEFAULT_SINK@ -5%
bind=NONE,XF86AudioMute,spawn,pactl set-sink-mute @DEFAULT_SINK@ toggle
bind=NONE,XF86MonBrightnessUp,spawn,brightnessctl set 10%+
bind=NONE,XF86MonBrightnessDown,spawn,brightnessctl set 10%-
bind=NONE,XF86AudioPlay,spawn,playerctl play-pause
bind=NONE,XF86AudioNext,spawn,playerctl next
bind=NONE,XF86AudioPrev,spawn,playerctl previous

# Power menu (same as dwm-titus — Quickshell, not wlogout)
bind=SUPER+CTRL,q,spawn,/bin/sh -c 'quickshell ipc --path "$HOME/.config/mango-titus/quickshell/shell.qml" call power toggle'
bind=SUPER+CTRL,r,spawn,protonrestart
bind=SUPER+CTRL+SHIFT,r,spawn,systemctl reboot
bind=SUPER+CTRL+SHIFT,s,spawn,systemctl suspend
# Quit compositor
bind=SUPER+CTRL+SHIFT,q,quit
bind=SUPER,q,killclient,

# switch window focus
bind=ALT,Left,focusdir,left
bind=ALT,Right,focusdir,right
bind=ALT,Up,focusdir,up
bind=ALT,Down,focusdir,down

# swap window
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right

# switch window status
bind=SUPER,g,toggleglobal,
bind=SUPER,Tab,toggleoverview,
bind=SUPER,space,togglefloating,
bind=ALT,a,togglemaximizescreen,
bind=SUPER,f,togglefullscreen,
bind=SUPER+SHIFT,f,togglefakefullscreen,
bind=SUPER,i,minimized,
bind=SUPER,o,toggleoverlay,
bind=SUPER+SHIFT,I,restore_minimized
bind=ALT,z,toggle_scratchpad

# scroller layout
bind=ALT,e,set_proportion,1.0
bind=ALT,x,switch_proportion_preset,

# switch layout
bind=SUPER,n,switch_layout

# tag switch
bind=SUPER,Left,viewtoleft,0
bind=CTRL,Left,viewtoleft_have_client,0
bind=SUPER,Right,viewtoright,0
bind=CTRL,Right,viewtoright_have_client,0
bind=CTRL+SUPER,Left,tagtoleft,0
bind=CTRL+SUPER,Right,tagtoright,0

bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0

# tag: move client to the tag and focus it
bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0

# monitor switch
bind=alt+shift,Left,focusmon,left
bind=alt+shift,Right,focusmon,right
bind=SUPER+Alt,Left,tagmon,left
bind=SUPER+Alt,Right,tagmon,right

# gaps
bind=ALT+SHIFT,X,incgaps,1
bind=ALT+SHIFT,Z,incgaps,-1
bind=ALT+SHIFT,R,togglegaps

# movewin
bind=CTRL+SHIFT,Up,movewin,+0,-50
bind=CTRL+SHIFT,Down,movewin,+0,+50
bind=CTRL+SHIFT,Left,movewin,-50,+0
bind=CTRL+SHIFT,Right,movewin,+50,+0

# resizewin
bind=CTRL+ALT,Up,resizewin,+0,-50
bind=CTRL+ALT,Down,resizewin,+0,+50
bind=CTRL+ALT,Left,resizewin,-50,+0
bind=CTRL+ALT,Right,resizewin,+50,+0

# Mouse Button Bindings
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=NONE,btn_middle,togglemaximizescreen,0
mousebind=SUPER,btn_right,moveresize,curresize

# Axis Bindings
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client
