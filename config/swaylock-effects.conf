# swaylock-effects — mango-titus (solid color; no screenshot/blur)
# Screenshot blur is unreliable on virtio/QEMU and often yields a white unlock screen.
daemonize
ignore-empty-password
show-failed-attempts
indicator
indicator-idle-visible
indicator-caps-lock
indicator-radius=100
indicator-thickness=10
clock
timestr=%H:%M
datestr=%a, %b %d
font=sans-serif
font-size=24
color=2e3440ff
inside-color=3b4252ee
inside-clear-color=a3be8cee
inside-ver-color=88c0d0ee
inside-wrong-color=bf616aee
ring-color=81a1c1ff
ring-clear-color=a3be8cff
ring-ver-color=88c0d0ff
ring-wrong-color=bf616aff
key-hl-color=88c0d0ff
bs-hl-color=bf616aff
line-color=00000000
text-color=eceff4ff
text-clear-color=eceff4ff
text-ver-color=eceff4ff
text-wrong-color=eceff4ff
layout-bg-color=00000000
layout-text-color=eceff4ff
separator-color=00000000
